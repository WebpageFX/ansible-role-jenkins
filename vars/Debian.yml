---
# See https://www.jenkins.io/blog/2025/12/23/repository-signing-keys-changing/
__jenkins_repo_url: deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian{{ '-stable' if (jenkins_prefer_lts | bool) else '' }} binary/
__jenkins_repo_key_url: https://pkg.jenkins.io/debian{{ '-stable' if (jenkins_prefer_lts | bool) else '' }}/jenkins.io-2026.key
__jenkins_pkg_url: https://pkg.jenkins.io/debian/binary
